name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    name: unittest (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python no longer ships 3.9 binaries for ubuntu-24.04+;
          # ubuntu-22.04 keeps Python 3.9 available.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests (no token, mock API)
        run: PYTHONPATH=. python -m unittest discover -s tests -v
